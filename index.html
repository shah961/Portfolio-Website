<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Floating Flower Heart</title>
  <style>
    * {
      touch-action: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050103;
      font-family: sans-serif;
    }
    #webcam {
      display: none;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #ff99dd;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      background: rgba(25, 5, 20, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 100, 200, 0.4);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 10px rgba(255, 100, 200, 0.3);
    }
  </style>

  <!-- Lightweight Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

  <div id="hud">SYSTEM: Camera Blocked</div>
  <video id="webcam" playsinline=""></video>

  <script>
    const hud = document.getElementById('hud');
    const videoElement = document.getElementById('webcam');

    // --- 1. GENERATE PROCEDURAL PINK FLOWER TEXTURE ---
    function createFlowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      const cx = 64;
      const cy = 64;
      const petals = 5;

      // Draw 5 smooth soft-pink petals
      for (let i = 0; i < petals; i++) {
        const angle = (i * 2 * Math.PI) / petals;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);

        const gradient = ctx.createRadialGradient(0, -22, 2, 0, -22, 22);
        gradient.addColorStop(0, 'rgba(255, 220, 245, 1)');
        gradient.addColorStop(0.5, 'rgba(255, 105, 180, 0.8)');
        gradient.addColorStop(1, 'rgba(215, 30, 120, 0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(0, -22, 12, 22, 0, 0, 2 * Math.PI);
        ctx.fill();
        ctx.restore();
      }

      // Yellow glowing flower pistil/center
      const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10);
      centerGrad.addColorStop(0, 'rgba(255, 255, 200, 1)');
      centerGrad.addColorStop(0.5, 'rgba(255, 215, 0, 0.9)');
      centerGrad.addColorStop(1, 'rgba(255, 140, 0, 0)');
      
      ctx.fillStyle = centerGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // --- 2. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "low-power" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    // Number of flower particles in the heart
    const particleCount = 750;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    // Generate 3D Parametric Heart Points
    for (let i = 0; i < particleCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * 2; // Surface depth variation
      
      // Standard 2D Heart Formula scaled down
      const scale = 0.11;
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      
      // Volumetric volume spread (3D depth layer)
      const rFactor = Math.pow(Math.random(), 0.3); // Push distribution nicely outwards
      x *= scale * rFactor;
      y *= scale * rFactor;
      let z = u * 0.4 * (1 - Math.abs(x / 2)); // Thicker at center, thinner at borders

      positions[i * 3]     = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    // Flower Particle Material
    const material = new THREE.PointsMaterial({
      color: 0xffcced,
      size: 0.28,                     // Flower particle visual size
      map: createFlowerTexture(),
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const heartOrb = new THREE.Points(geometry, material);
    scene.add(heartOrb);

    // Dynamic targets for hand gesture control
    let targetX = 0;
    let targetY = 0;
    let targetScale = 1;
    let targetRotationY = 0;

    // --- 3. MEDIAPIPE TRACKING ---
    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        hud.innerText = "SYSTEM: Hand Locked";
        const landmarks = results.multiHandLandmarks[0];

        // Wrist (0): Position tracking
        const wrist = landmarks[0];
        targetX = (0.5 - wrist.x) * 4;
        targetY = (0.5 - wrist.y) * 5;

        // Thumb Tip (4) & Index Tip (8): Zoom tracking
        const thumb = landmarks[4];
        const index = landmarks[8];
        const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        
        targetScale = Math.min(Math.max(pinchDist * 3.5, 0.6), 1.8);

        // Middle Finger Tip (12): Rotation tracking
        const middleTip = landmarks[12];
        targetRotationY = (middleTip.x - wrist.x) * 5;
      } else {
        hud.innerText = "SYSTEM: Searching Hand...";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // --- 4. CAMERA SETUP ---
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 320 },
            height: { ideal: 240 }
          }
        });
        
        videoElement.srcObject = stream;
        await videoElement.play();

        const cameraUtils = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 320,
          height: 240
        });
        cameraUtils.start();
      } catch (err) {
        hud.innerText = "SYSTEM: Camera Blocked";
      }
    }

    startCamera();

    // --- 5. RENDER & ANIMATION LOOP ---
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);

      time += 0.04;

      // Smooth movement interpolation
      heartOrb.position.x += (targetX - heartOrb.position.x) * 0.1;
      heartOrb.position.y += (targetY - heartOrb.position.y) * 0.1;

      // Scale zoom interpolation
      const currentScale = heartOrb.scale.x;
      const nextScale = currentScale + (targetScale - currentScale) * 0.1;
      heartOrb.scale.setScalar(nextScale);

      // Rotation interpolation
      heartOrb.rotation.y += (targetRotationY - heartOrb.rotation.y) * 0.1 + 0.005;
      
      // Heart pulsing beat animation
      const heartPulse = 1 + Math.sin(time * 3) * 0.05;
      heartOrb.scale.multiplyScalar(heartPulse);

      // Soft twinkle/shimmer effect
      material.opacity = 0.85 + Math.sin(time * 2) * 0.15;

      renderer.render(scene, camera);
    }
    animate();

    // Screen resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body></html>
